<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Purblic Level List</title>
  <link rel="icon" href="1000094201.png" />
  <style>
    :root{
      --bg:#090b12;
      --bg-2:#0d1220;
      --panel:#111827;
      --panel-2:#0c1424;
      --line:rgba(255,255,255,.08);
      --text:#eef2ff;
      --muted:#9aa7c2;
      --purple:#5d7ef5;
      --purple-2:#8e7ef9;
      --purple-3:#3a4fd6;
      --shadow:rgba(52,60,121,.5);
    }

    *{box-sizing:border-box}
    html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
    body{
      background:
        radial-gradient(circle at 20% 0%, rgba(91,100,255,.18), transparent 24%),
        radial-gradient(circle at 80% 10%, rgba(145,110,255,.12), transparent 30%),
        var(--bg);
    }

    .app{
      max-width: 1500px;
      margin: 0 auto;
      min-height: 100vh;
      padding: 16px 20px 28px;
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:18px;
      padding: 14px 18px 18px;
      border-bottom:1px solid rgba(255,255,255,.08);
      margin-bottom: 18px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      font-weight:800;
      font-size: clamp(1.7rem, 2vw, 2.5rem);
      letter-spacing:-.04em;
    }

    .brand-icon{
      width:42px;height:42px;border-radius:12px;
      background:linear-gradient(135deg,#1c2b47,#4b81d9);
      border:1px solid rgba(255,255,255,.12);
      display:grid;place-items:center;
      box-shadow:0 0 25px rgba(87,138,255,.3);
      font-size:18px;font-weight:700;
    }

    .subtitle{
      font-size: 12px;
      color: var(--muted);
      margin-left:8px;
      letter-spacing:.12em;
      text-transform:uppercase;
      opacity:.8;
    }

    .nav{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
    }

    .nav button{
      border:1px solid var(--line);
      background:#101821;
      color:var(--text);
      padding:10px 16px;
      border-radius:10px;
      font-weight:700;
      cursor:pointer;
      transition:.15s ease;
    }

    .nav button:hover, .nav button.active{
      background:linear-gradient(180deg,#20315a,#152544);
      border-color: rgba(135,150,255,.6);
      box-shadow: inset 0 0 0 1px rgba(169,186,255,.18);
    }

    .layout{
      display:grid;
      grid-template-columns: 360px minmax(0,1fr);
      gap: 0;
      border:1px solid var(--line);
      border-radius:18px;
      overflow:hidden;
      background:rgba(14,17,24,.8);
      box-shadow:0 28px 60px rgba(0,0,0,.28);
    }

    .sidebar{
      background:linear-gradient(180deg,#0a1019,#0a1018);
      border-right:1px solid var(--line);
      min-height: 760px;
    }

    .side-header{
      display:flex;align-items:center;justify-content:space-between;
      padding: 20px 18px 14px;
      gap:12px;
    }

    .side-header .tab{
      flex:1;
      background:linear-gradient(180deg,#1d2d55,#122a4d);
      color:#eaf2ff;
      border:1px solid rgba(117,140,255,.35);
      border-radius:10px;
      padding:12px 14px;
      font-weight:800;
      cursor:pointer;
      text-align:center;
    }

    .side-header .close{
      width:38px;height:38px;border-radius:10px;
      border:1px solid var(--line);
      background:#0f1727;
      color: var(--text);
      font-size: 26px;
      cursor:pointer;
    }

    .search-wrap{
      padding: 0 16px 14px;
    }

    .search{
      width:100%;
      padding: 14px 16px 14px 42px;
      border-radius:12px;
      border:1px solid var(--line);
      background: rgba(255,255,255,.02);
      color: var(--text);
      font-size: 1.05rem;
      outline:none;
    }

    .search::placeholder{ color:#8997b5; }

    .level-list{
      max-height: 680px;
      overflow:auto;
      padding: 0 10px 20px;
    }

    .level-item{
      width:100%;
      display:grid;
      grid-template-columns: 42px 34px minmax(0,1fr);
      align-items:center;
      gap:10px;
      background:transparent;
      border:1px solid transparent;
      border-radius:12px;
      color:var(--text);
      padding: 12px 10px;
      margin-bottom:5px;
      text-align:left;
      cursor:pointer;
      transition:.15s ease;
    }

    .level-item:hover{
      background: rgba(255,255,255,.02);
    }

    .level-item.selected{
      background:linear-gradient(90deg, rgba(94,111,255,.14), rgba(255,255,255,.02));
      border-color: rgba(124,139,255,.28);
      box-shadow: inset 0 0 0 1px rgba(82,98,255,.16);
    }

    .rank{
      color:#bfd3ff;
      font-weight:800;
      font-size:1.3rem;
      margin-left:8px;
    }

    .mini-icon{
      width:30px;height:30px;border-radius:10px;
      background:linear-gradient(135deg,#2d3556,#151d2d);
      display:grid;place-items:center;
      border:1px solid rgba(255,255,255,.08);
      font-size:13px;
      color:#dfe9ff;
    }

    .level-main{
      min-width:0;
    }

    .level-name{
      display:block;
      font-size:1.15rem;
      font-weight:800;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .level-author{
      display:block;
      color:var(--muted);
      font-size:.88rem;
      margin-top:3px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .content{
      background:rgba(8,12,20,.82);
      padding: 28px 26px 24px;
      min-width:0;
    }

    .title-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:18px;
    }

    .big-title{
      font-size: clamp(2rem,2.4vw,3.2rem);
      font-weight:900;
      letter-spacing:-.05em;
      margin:0;
    }

    .record-badge{
      background:rgba(255,255,255,.02);
      border:1px solid rgba(255,255,255,.08);
      border-radius:12px;
      padding:10px 14px;
      font-weight:700;
      color:#dfe9ff;
      display:inline-flex;align-items:center;gap:8px;
      white-space:nowrap;
    }

    .detail-card{
      background:rgba(9,13,23,.9);
      border:1px solid var(--line);
      border-radius:16px;
      padding:20px 18px 0;
      box-shadow:0 22px 35px rgba(3,5,10,.28);
    }

    .meta-row{
      display:flex;
      align-items:center;
      gap:18px;
      margin-bottom:18px;
    }

    .big-icon{
      width:82px;height:82px;border-radius:22px;
      background:linear-gradient(135deg,#32214d,#171a2a);
      border:1px solid rgba(145,118,255,.35);
      display:grid;place-items:center;
      font-size:2rem;
      box-shadow:inset 0 0 18px rgba(139,109,255,.15);
    }

    .meta-text{
      display:flex;
      flex-direction:column;
      gap:6px;
    }

    .meta-text .block{
      font-size:2.2rem;
      font-weight:900;
      letter-spacing:-.04em;
      line-height:1.1;
    }

    .meta-text .byline{
      font-size:1rem;
      color:var(--muted);
    }

    .video{
      width:100%;
      display:block;
      aspect-ratio: 16 / 9;
      border-radius: 14px;
      background:
        linear-gradient(180deg, rgba(90,150,255,.18), rgba(90,150,255,.05)),
        linear-gradient(135deg,#0a1225,#101a2d);
      border:1px solid rgba(255,255,255,.08);
      margin-top: 8px;
      overflow:hidden;
    }

    .video iframe{
      width:100%;
      height:100%;
      border:0;
      display:block;
      background:#000;
    }

    .stats{
      display:grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 16px;
      margin-top: 18px;
      padding: 0 0 16px;
    }

    .stat{
      background: rgba(255,255,255,.012);
      border:1px solid var(--line);
      border-radius: 12px;
      padding: 18px 16px 14px;
      min-height: 108px;
    }

    .stat-label{
      color:var(--muted);
      text-transform:uppercase;
      letter-spacing:.16em;
      font-size:.7rem;
      display:block;
      margin-bottom:10px;
      text-align:center;
    }

    .stat-value{
      display:block;
      text-align:center;
      font-size: clamp(1.8rem,2vw,2.7rem);
      font-weight:900;
      letter-spacing:-.05em;
      color:#dff3ff;
    }

    .side-info{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 18px;
      padding-bottom:18px;
    }

    .fact{
      background: rgba(255,255,255,.012);
      border:1px solid var(--line);
      border-radius: 12px;
      padding: 14px 16px;
    }

    .fact .lbl{
      display:block;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .14em;
      font-size: .68rem;
      margin-bottom: 8px;
    }

    .fact .val{
      font-weight:900;
      font-size: 1.35rem;
    }

    .records{
      margin-top: 18px;
      border-top:1px solid var(--line);
      padding-top: 14px;
    }

    .records-header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom: 10px;
    }

    .record-item{
      display:grid;
      grid-template-columns: 1fr auto auto;
      align-items:center;
      gap: 10px;
      border-top:1px solid var(--line);
      padding: 12px 0;
    }

    .record-item .name{
      font-weight:700;
      font-size:1rem;
    }

    .record-item .pct{
      color: var(--muted);
      font-weight:700;
    }

    .record-item .status{
      color: #8deab9;
      font-weight:700;
      font-size: .82rem;
    }

    .record-item a{
      color:#a9b8ff;
      text-decoration:none;
      font-weight:700;
      font-size: .8rem;
    }

    .leaderboard-wrap{
      display:none;
    }

    .leaderboard-table{
      width:100%;
      border-collapse:collapse;
      background:rgba(9,13,23,.9);
      border:1px solid var(--line);
      border-radius:16px;
      overflow:hidden;
    }

    .leaderboard-table th, .leaderboard-table td{
      padding: 14px 18px;
      border-bottom:1px solid var(--line);
      text-align:left;
    }

    .leaderboard-table th{
      color:var(--muted);
      text-transform:uppercase;
      letter-spacing:.15em;
      font-size:.7rem;
      font-weight:800;
    }

    .leaderboard-table td{
      font-size:1.05rem;
    }

    @media (max-width: 980px){
      .layout{grid-template-columns:1fr;}
      .sidebar{border-right:none;border-bottom:1px solid var(--line);}
      .content{padding:18px 16px 22px;}
      .level-list{max-height:420px;}
      .title-row{flex-direction:column;align-items:flex-start;}
      .topbar{flex-wrap:wrap;}
    }

    @media (max-width: 560px){
      .app{padding:12px 10px 18px;}
      .brand{font-size:1.35rem;}
      .brand .subtitle{display:none;}
      .nav{width:100%;}
      .nav button{flex:1;}
      .meta-row{flex-direction:column;align-items:flex-start;}
      .stats,.side-info{grid-template-columns:1fr;}
      .record-item{grid-template-columns:1fr auto;}
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-icon">PL</div>
        <div>Purblic Level List <span class="subtitle">v3</span></div>
      </div>
      <nav class="nav" aria-label="Main navigation">
        <button type="button" class="active">Levels</button>
        <button type="button">Leaderboard</button>
      </nav>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <div class="side-header">
          <button class="tab" type="button">Levels</button>
          <button class="close" type="button" aria-label="Close menu">‹</button>
        </div>
        <div class="search-wrap">
          <input id="searchInput" class="search" type="search" placeholder="Search levels..." />
        </div>
        <div id="levelList" class="level-list"></div>
      </aside>

      <main class="content">
        <section id="levelView">
          <div class="title-row">
            <h1 class="big-title" id="pageTitle">Loading...</h1>
            <span class="record-badge">Records (0)</span>
          </div>

          <div class="detail-card">
            <div class="meta-row">
              <div class="big-icon">◈</div>
              <div class="meta-text">
                <div class="meta-text block" id="detailTitle">Loading...</div>
                <div class="byline" id="detailCreator">by ...</div>
              </div>
            </div>

            <div class="video">
              <iframe id="videoFrame" src="" title="Level video" allowfullscreen></iframe>
            </div>

            <div class="stats">
              <div class="stat">
                <span class="stat-label">Points</span>
                <span class="stat-value" id="pointsValue">0</span>
              </div>
              <div class="stat">
                <span class="stat-label">Level ID</span>
                <span class="stat-value" id="levelIdValue">N/A</span>
              </div>
            </div>

            <div class="side-info">
              <div class="fact">
                <span class="lbl">Creator</span>
                <div class="val" id="creatorValue">-</div>
              </div>
              <div class="fact">
                <span class="lbl">Minimum %</span>
                <div class="val" id="minPercentValue">-</div>
              </div>
            </div>

            <div class="records">
              <div class="records-header">
                <h3>Records</h3>
                <span id="recordCount">0</span>
              </div>
              <div id="recordsList"></div>
            </div>
          </div>
        </section>

        <section id="leaderboardView" class="leaderboard-wrap">
          <div class="title-row">
            <h1 class="big-title">Leaderboard</h1>
            <span class="record-badge">Top players</span>
          </div>

          <table class="leaderboard-table">
            <thead>
              <tr>
                <th>Rank</th>
                <th>Player</th>
                <th>Points</th>
              </tr>
            </thead>
            <tbody id="leaderboardBody"></tbody>
          </table>
        </section>
      </main>
    </div>
  </div>

  <script>
    const levelListEl = document.getElementById("levelList");
    const searchInput = document.getElementById("searchInput");
    const pageTitle = document.getElementById("pageTitle");
    const detailTitle = document.getElementById("detailTitle");
    const detailCreator = document.getElementById("detailCreator");
    const pointsValue = document.getElementById("pointsValue");
    const levelIdValue = document.getElementById("levelIdValue");
    const creatorValue = document.getElementById("creatorValue");
    const minPercentValue = document.getElementById("minPercentValue");
    const recordsList = document.getElementById("recordsList");
    const recordCount = document.getElementById("recordCount");
    const videoFrame = document.getElementById("videoFrame");
    const leaderboardBody = document.getElementById("leaderboardBody");
    const levelView = document.getElementById("levelView");
    const leaderboardView = document.getElementById("leaderboardView");
    const navButtons = document.querySelectorAll(".nav button");

    let levels = [];
    let selectedPlacement = 1;

    function escapeHtml(str) {
      return String(str ?? "").replace(/[&<>"']/g, char => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        "\"":"&quot;",
        "'":"&#39;"
      }[char]));
    }

    function getYoutubeEmbed(url){
      if(!url) return "";
      try{
        const u = new URL(url);
        let id = "";
        if(u.hostname.includes("youtu.be")) id = u.pathname.replace("/", "");
        else if(u.hostname.includes("youtube.com")) id = u.searchParams.get("v") || "";
        return id ? "https://www.youtube-nocookie.com/embed/" + id : "";
      }catch(e){return "";}
    }

    async function loadData() {
      try {
        const [levelsRes, boardRes] = await Promise.all([
          fetch("data.json"),
          fetch("leaderboard.json")
        ]);

        if (!levelsRes.ok || !boardRes.ok) throw new Error("Failed to load JSON.");

        const levelsData = await levelsRes.json();
        const boardData = await boardRes.json();

        levels = Array.isArray(levelsData.levels) ? levelsData.levels : [];
        levels.sort((a,b) => Number(a.placement) - Number(b.placement));

        renderList();
        if (levels.length) selectLevel(levels[0].placement);

        renderLeaderboard(boardData.users || []);
      } catch (error) {
        console.error(error);
        pageTitle.textContent = "Data not available";
      }
    }

    function renderLeaderboard(users) {
      leaderboardBody.innerHTML = "";
      if (!users.length) {
        leaderboardBody.innerHTML = '<tr><td colspan="3">No users yet.</td></tr>';
        return;
      }

      users
        .sort((a, b) => Number(b.points) - Number(a.points))
        .forEach((user, index) => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>#${index + 1}</td>
            <td>${escapeHtml(user.name || "Unknown")}</td>
            <td>${escapeHtml(user.points || 0)}</td>
          `;
          leaderboardBody.appendChild(tr);
        });
    }

    function renderList() {
      const query = searchInput.value.trim().toLowerCase();
      levelListEl.innerHTML = "";

      const filtered = levels.filter(level => {
        const text = `${level.name || ""} ${level.creator || ""} ${level.placement || ""} ${level.id || ""}`.toLowerCase();
        return !query || text.includes(query);
      });

      filtered.forEach(level => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "level-item" + (Number(level.placement) === Number(selectedPlacement) ? " selected":"");
        btn.innerHTML = `
          <span class="rank">#${escapeHtml(level.placement)}</span>
          <span class="mini-icon">◈</span>
          <span class="level-main">
            <span class="level-name">${escapeHtml(level.name)}</span>
            <span class="level-author">by ${escapeHtml(level.creator || "Unknown")}</span>
          </span>
        `;
        btn.addEventListener("click", () => selectLevel(level.placement));
        levelListEl.appendChild(btn);
      });

      if (!filtered.length) {
        levelListEl.innerHTML = '<div style="padding:12px 16px;color:#8f9ab3;">No levels match your search.</div>';
      }
    }

    function selectLevel(placement) {
      const level = levels.find(l => Number(l.placement) === Number(placement));
      if (!level) return;

      selectedPlacement = Number(placement);
      renderList();

      const embed = getYoutubeEmbed(level.video);
      pageTitle.textContent = level.name;
      detailTitle.textContent = level.name;
      detailCreator.textContent = "by " + (level.creator || "Unknown");
      pointsValue.textContent = level.points ?? "0";
      levelIdValue.textContent = level.id ?? "N/A";
      creatorValue.textContent = level.creator || "Unknown";
      minPercentValue.textContent = level.minimumPercentage ? level.minimumPercentage + "%" : "N/A";
      recordCount.textContent = (level.records || []).length;

      if (embed) {
        videoFrame.src = embed;
      } else {
        videoFrame.src = "about:blank";
      }

      recordsList.innerHTML = "";
      const records = Array.isArray(level.records) ? level.records : [];
      if (!records.length) {
        recordsList.innerHTML = '<div style="color:#8f9ab3;padding:12px 0;">No records yet.</div>';
        return;
      }

      records.forEach(rec => {
        const row = document.createElement("div");
        row.className = "record-item";
        row.innerHTML = `
          <div class="name">${escapeHtml(rec.name || "Unknown")}</div>
          <div class="pct">${escapeHtml(rec.percentage ?? 0)}%</div>
          <div class="status">${rec.verified ? "Verified" : "Unverified"}</div>
          ${rec.video ? `<a href="${escapeHtml(rec.video)}" target="_blank" rel="noreferrer">Watch↗</a>` : ""}
        `;
        recordsList.appendChild(row);
      });
    }

    navButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        navButtons.forEach(b => b.classList.toggle("active", b === btn));
        const isLeader = btn.textContent.trim().toLowerCase() === "leaderboard";
        levelView.style.display = isLeader ? "none" : "block";
        leaderboardView.style.display = isLeader ? "block" : "block";
      });
    });

    searchInput.addEventListener("input", renderList);

    loadData();
  </script>
</body>
</html>
